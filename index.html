<!doctype html>
<html class="dark" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KAE Engineering | Инженерные решения нового поколения</title>
    <meta
      name="description"
      content="KAE Engineering — инженерные решения и оборудование профессиональной радиосвязи: разработка, производство и поставка систем для промышленности и инфраструктуры Казахстана."
    />
    <meta name="theme-color" content="#0e1417" />
    <link rel="icon" href="/kae-logo.svg" type="image/svg+xml" />

    <!-- Значения по умолчанию для превью ссылки. Дальше их перезаписывает
         src/lib/seo.js под конкретную страницу — краулер, выполняющий JS,
         увидит уже уточнённые. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KAE Engineering" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="KAE Engineering | Инженерные решения нового поколения" />
    <meta
      property="og:description"
      content="Инженерные решения и оборудование профессиональной радиосвязи для промышленности и инфраструктуры Казахстана."
    />
    <meta property="og:image" content="/kae-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Шрифты живут у нас: public/fonts, объявлены в src/fonts.css, названы
         в @theme (src/styles.css). Внешнего CDN нет — первый экран не должен
         ждать чужой домен, а кириллица не должна зависеть от того, какое
         подмножество отдадут сегодня.

         Дисплей и текст предзагружены латиницей и кириллицей: этими четырьмя
         файлами набран весь первый экран на обоих языках. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/oswald-300-600-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/oswald-300-600-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/firasanscondensed-300-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/firasanscondensed-300-cyrillic.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
